<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>sarah</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #080809;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 2rem 1rem;
    color: #e5e7eb;
  }

  .card {
    width: 100%;
    max-width: 540px;
    background: #16181f;
    border-radius: 18px;
    border: 1px solid #23252f;
    padding: 2rem 1.75rem 1.5rem;
    position: relative;
  }

  /* ── Avatar (top-right) ── */
  .avatar {
    position: absolute;
    top: 1.75rem;
    right: 1.75rem;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #23252f;
    border: 2px solid #2f3140;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: #6b7280;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  /* ── Header ── */
  .header { margin-bottom: 1.5rem; }
  .username {
    font-size: 19px;
    font-weight: 600;
    color: #f3f4f6;
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 4px;
  }
  .star-badge {
    width: 20px; height: 20px;
    background: #5865f2;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .star-badge svg { width: 11px; height: 11px; fill: white; }
  .joined { font-size: 12px; color: #6b7280; }

  /* ── Link rows ── */
  .links { display: flex; flex-direction: column; gap: 9px; margin-bottom: 1rem; }

  .link-row {
    background: #0f1016;
    border: 1px solid #23252f;
    border-radius: 11px;
    display: flex;
    align-items: center;
    padding: 10px 13px;
    gap: 12px;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.14s;
  }
  .link-row:hover { background: #1b1d27; }

  .action-btn {
    background: #1e2030;
    border: 1px solid #2f3140;
    color: #c9ccd6;
    font-size: 13px;
    border-radius: 20px;
    padding: 5px 15px;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    transition: background 0.14s;
  }
  .action-btn:hover { background: #252840; }

  .link-info {
    flex: 1;
    text-align: right;
  }
  .link-title { font-size: 14px; color: #e5e7eb; font-weight: 500; }
  .link-sub   { font-size: 12px; color: #6b7280; margin-top: 2px; }

  .link-icon {
    width: 34px; height: 34px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  /* status dot */
  .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
  }
  .dot-red   { background: #ef4444; }
  .dot-green { background: #22c55e; }
  .dot-yellow{ background: #eab308; }

  /* mini avatar */
  .mini-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: #23252f;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .mini-avatar img { width: 100%; height: 100%; object-fit: cover; }

  /* ── Footer meta ── */
  .footer-meta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font-size: 12px;
    color: #4b5563;
    margin-top: 0.5rem;
    margin-bottom: 0.9rem;
  }
  .footer-meta span { display: flex; align-items: center; gap: 4px; }

  /* ── Social icons ── */
  .socials {
    display: flex;
    justify-content: center;
    gap: 9px;
  }
  .social-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: #0f1016;
    border: 1px solid #23252f;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.14s;
    text-decoration: none;
    color: #9ca3af;
  }
  .social-btn:hover { background: #1b1d27; color: #e5e7eb; }
  .social-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .social-btn.yt { color: #ef4444; }
</style>
</head>
